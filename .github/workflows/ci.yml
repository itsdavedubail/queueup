name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queueup
          POSTGRES_PASSWORD: queueup
          POSTGRES_DB: queueup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queueup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://queueup:queueup@localhost:5432/queueup
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Migrations apply and roll back cleanly on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -v
